name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  issues: read
  
jobs:
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate version input
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [[ "$VERSION" == v* ]]; then
            echo "::error::Version must be passed without leading 'v' (example: 1.3.0)."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use semantic format x.y.z (example: 1.3.0)."
            exit 1
          fi

      - name: Check the embedded version matches the release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"

          # Without this the artifacts can claim a version that differs from the
          # release: v1.4.0 and v1.4.1 both shipped binaries reporting 1.3.0, which
          # is also the value used by the strict client/server handshake.
          major=$(sed -n 's/^#define VERSION_MAJOR[[:space:]]*\([0-9]\+\).*$/\1/p' src/shared/version.hpp)
          minor=$(sed -n 's/^#define VERSION_MINOR[[:space:]]*\([0-9]\+\).*$/\1/p' src/shared/version.hpp)
          patch=$(sed -n 's/^#define VERSION_PATCH[[:space:]]*\([0-9]\+\).*$/\1/p' src/shared/version.hpp)

          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "::error::Could not read VERSION_MAJOR/VERSION_MINOR/VERSION_PATCH from src/shared/version.hpp."
            exit 1
          fi

          embedded="${major}.${minor}.${patch}"
          if [[ "$embedded" != "$VERSION" ]]; then
            echo "::error::src/shared/version.hpp declares ${embedded} but the release version is ${VERSION}. Bump the version before releasing."
            exit 1
          fi

          # Every Windows version resource has to agree as well.
          expected="${VERSION}.0"
          failed=0
          while IFS= read -r file; do
            actual=$(sed -n 's/^[[:space:]]*VERSION "\([0-9.]\+\)".*$/\1/p' "$file" | head -n1)
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::${file} declares VERSION \"${actual}\", expected \"${expected}\"."
              failed=1
            fi
          done < <(grep -rl 'add_win_version_resource' --include=CMakeLists.txt src)

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "Version check passed: ${embedded} (version resources: ${expected})."

  call-build-client:
    name: Build Client
    needs: [validate-version]
    uses: ./.github/workflows/build-client-reusable.yml
    with:
      version: ${{ github.event.inputs.version }}
      cef-version: 148.0.10+g7ee53f5+chromium-148.0.7778.218
      cef-arch: windows32
      build-type: Release

  call-build-server:
    name: Build Server (${{ matrix.target }} ${{ matrix.arch }})
    needs: [call-build-client]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ServerOmp
            arch: x86
          - target: ServerOmp
            arch: x64
          - target: ServerSamp
            arch: x86
          - target: ServerSamp
            arch: x64
    uses: ./.github/workflows/build-server-reusable.yml
    with:
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      build-type: Release

  call-create-release:
    name: Create Release
    needs: [call-build-client, call-build-server]
    uses: ./.github/workflows/create-release-reusable.yml
    with:
      version: ${{ github.event.inputs.version }}
    secrets: inherit
